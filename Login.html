<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gastos Familiares — Iniciar sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="page">

        <div class="logo-row">
            <span class="logo-mark">◈</span>
            <span class="logo-name">Gastos Familiares</span>
        </div>

        <div class="card">
            <h1>Iniciar sesión</h1>
            <p class="subtitle">Accede a tu cuenta familiar</p>

            <div id="error-msg" class="error-msg" role="alert" aria-live="polite"></div>

            <div class="field">
                <label for="login-email">Correo electrónico</label>
                <input type="email" id="login-email" placeholder="familia@email.com" autocomplete="email">
            </div>

            <div class="field">
                <div class="field-header">
                    <label for="login-password">Contraseña</label>
                </div>
                <div class="input-wrap">
                    <input type="password" id="login-password" placeholder="Tu contraseña" autocomplete="current-password">
                    <button class="toggle-pw" type="button" id="toggle-pw" aria-label="Mostrar contraseña">
                        <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>

            <button class="btn-submit" id="btn-login">Entrar</button>

            <p class="register-link">¿No tienes cuenta? <a href="register.html">Regístrate</a></p>
        </div>

    </div>
  <div id="verified-modal" class="verified-toast" style="display: none;">
    <div class="verified-content">
        <span class="verified-icon">✅</span>
        <div>
            <h3>¡Correo verificado con éxito!</h3>
            <p>Tu cuenta ya está activa. Ya podés iniciar sesión.</p>
        </div>
        <button onclick="document.getElementById('verified-modal').style.display='none'">✕</button>
    </div>
</div>

    <script src="login.js"></script>
</body>

</html>
