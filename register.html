<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gastos Familiares — Crear cuenta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="page">

        <div class="logo-row">
            <span class="logo-mark">◈</span>
            <span class="logo-name">Gastos Familiares</span>
        </div>

        <div class="card">
            <h1>Crear cuenta</h1>
            <p class="subtitle">Registra a tu familia para empezar</p>

            <div id="error-msg" class="error-msg" role="alert" aria-live="polite"></div>

            <div class="field">
                <label for="reg-email">Correo electrónico</label>
                <input type="email" id="reg-email" placeholder="familia@email.com" autocomplete="email">
            </div>

            <div class="field">
                <div class="field-header">
                    <label for="reg-password">Contraseña</label>
                </div>
                <div class="input-wrap">
                    <input type="password" id="reg-password" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
                    <button class="toggle-pw" type="button" id="toggle-pw" aria-label="Mostrar contraseña">
                        <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>

            <div class="field">
                <div class="field-header">
                    <label for="reg-password2">Confirmar contraseña</label>
                </div>
                <div class="input-wrap">
                    <input type="password" id="reg-password2" placeholder="Repite tu contraseña" autocomplete="new-password">
                    <button class="toggle-pw" type="button" id="toggle-pw2" aria-label="Mostrar contraseña">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                </div>
            </div>

            <button class="btn-submit" id="btn-register">Registrarme</button>

            <p class="register-link">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="register.js"></script>
</body>

</html>
